name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses & verify SDK 34
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & typecheck
        run: npm run build

      - name: Initialize Capacitor Android project
        env:
          CAPACITOR_TELEMETRY: "false"
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Restore permanent Android signing keystore from secret
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "::error title=Missing Keystore Secret::ANDROID_DEBUG_KEYSTORE_B64 is not set! Refusing to sign release APK with an ephemeral keystore."
              exit 1
            fi
            echo "Warning: ANDROID_DEBUG_KEYSTORE_B64 secret missing on branch build; Gradle will generate a temporary debug keystore."
          else
            mkdir -p ~/.android
            printf "%s" "$ANDROID_DEBUG_KEYSTORE_B64" | tr -d "\r\n " | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "Verified permanent Android signing keystore."
          fi

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log || {
            ERR=$(grep -A 3 -iE "\.java:[0-9]+: error:|error:|Execution failed|Caused by:" /tmp/gradle.log | head -n 40 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Gradle Build Failure::$ERR"
            exit 1
          }

      - name: Package named APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/Otzar-Sefarim-Mobile-${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otzar-Sefarim-Mobile-APK
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: apk-out/*.apk
          generate_release_notes: true
