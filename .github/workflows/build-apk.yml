name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses & verify SDK 34
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Promote UI strings from Firestore (if secret configured)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/promote-ui-strings.mjs --platform mobile

      - name: Check strings parity
        run: node scripts/check-strings-parity.mjs

      - name: Build web bundle & typecheck
        run: npm run build

      - name: Restore & verify permanent Android signing keystore
        env:
          OTZAR_KEYSTORE_B64: ${{ secrets.OTZAR_KEYSTORE_B64 }}
          OTZAR_KEYSTORE_PASSWORD: ${{ secrets.OTZAR_KEYSTORE_PASSWORD }}
          OTZAR_KEY_ALIAS: ${{ secrets.OTZAR_KEY_ALIAS }}
        run: |
          if [ -z "$OTZAR_KEYSTORE_B64" ] || [ -z "$OTZAR_KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing Signing Keystore::OTZAR_KEYSTORE_B64 or OTZAR_KEYSTORE_PASSWORD is not configured in repository secrets!"
            exit 1
          fi
          KS_PATH="$RUNNER_TEMP/otzar-signing.p12"
          printf "%s" "$OTZAR_KEYSTORE_B64" | tr -d "\r\n " | base64 -d > "$KS_PATH"
          ALIAS="${OTZAR_KEY_ALIAS:-otzar}"
          keytool -list -keystore "$KS_PATH" -storetype PKCS12 -storepass "$OTZAR_KEYSTORE_PASSWORD" -alias "$ALIAS" >/dev/null
          echo "OTZAR_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "OTZAR_KEYSTORE_PASSWORD=$OTZAR_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OTZAR_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "Verified permanent PKCS12 signing keystore (alias=$ALIAS)."

      - name: Initialize Capacitor Android project
        env:
          CAPACITOR_TELEMETRY: "false"
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Build signed Release Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle.log || {
            ERR=$(grep -A 3 -iE "\.java:[0-9]+: error:|error:|Execution failed|Caused by:" /tmp/gradle.log | head -n 40 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Gradle Build Failure::$ERR"
            exit 1
          }

      - name: Verify APK signing certificate fingerprint
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error title=Missing Release APK::$APK_PATH not found!"
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          ACTUAL_SHA=$(keytool -printcert -jarfile "$APK_PATH" | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA="8B:CA:F5:C3:2B:40:D8:0D:33:E3:4F:B3:55:7A:AB:BA:7F:93:23:DF:71:AA:E3:05:DC:D4:D1:2F:1F:67:20:30"
          echo "APK Certificate SHA-256: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=Signing Key Mismatch::Expected $EXPECTED_SHA but got $ACTUAL_SHA"
            exit 1
          fi
          echo "Confirmed APK is signed with the permanent Otzar Sefarim key."

      - name: Cleanup keystore from runner temp
        if: always()
        run: rm -f "$RUNNER_TEMP/otzar-signing.p12"

      - name: Package named APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk "apk-out/Otzar-Sefarim-Mobile-${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otzar-Sefarim-Mobile-APK
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: apk-out/*.apk
          generate_release_notes: true
