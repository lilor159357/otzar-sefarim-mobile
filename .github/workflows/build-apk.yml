name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & typecheck
        run: npm run build

      - name: Initialize Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package named APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/Otzar-Sefarim-Mobile-${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otzar-Sefarim-Mobile-APK
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: apk-out/*.apk
          generate_release_notes: true
